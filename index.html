<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Neighbors — Prototype</title>
<style>
:root{
  --ink:#2d342f;
  --paper:#fbfbf8;
  --tile:#dfe3de;
  --tile-shadow:#b5bcb6;
  --green:#9ccfa8;
  --green-shadow:#77a986;
  --yellow:#efd37a;
  --yellow-shadow:#c8ac57;
  --cream:#d9cfb8;
  --cream-shadow:#b8ad93;
  --board-line:#d9ddd8;
  --button:#ffffffee;
  --button-border:#2d342f;
  --size:min(calc((100vw - 64px) / 4), 82px);
  --gap:6px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{overscroll-behavior-y:contain}
button{font:inherit;cursor:pointer}
.main{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px 16px 34px}
.wrap{width:min(100%, 430px)}
.board-shell{position:relative;display:flex;justify-content:center}
.board{
  display:grid;
  grid-template-columns:repeat(4,var(--size));
  grid-template-rows:repeat(4,var(--size));
  gap:var(--gap);
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
}
.tile{
  position:relative;
  border:0;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--tile);
  color:#313832;
  font-size:clamp(27px, 7.4vw, 38px);
  font-weight:860;
  letter-spacing:-1.2px;
  box-shadow:0 4px 0 var(--tile-shadow);
  transition:background .14s ease, transform .12s ease, box-shadow .12s ease;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
  cursor:grab;
}
.tile[data-color="green"]{background:var(--green);box-shadow:0 4px 0 var(--green-shadow)}
.tile[data-color="yellow"]{background:var(--yellow);box-shadow:0 4px 0 var(--yellow-shadow)}
.tile[data-color="gray"]{background:var(--tile);box-shadow:0 4px 0 var(--tile-shadow)}
.tile.clue{
  background:var(--cream);
  box-shadow:0 4px 0 var(--cream-shadow);
  cursor:default;
}
.tile.drag-source{opacity:.23}
.tile.drop-target{outline:3px solid #5c665f;outline-offset:-3px;transform:scale(.96)}
.new-game{
  position:absolute;
  top:10px;
  right:10px;
  width:38px;
  height:38px;
  border-radius:999px;
  border:2px solid var(--button-border);
  background:var(--button);
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:800;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  z-index:5;
}
.swapline{
  text-align:center;
  margin-top:18px;
  font-size:21px;
  font-weight:820;
  letter-spacing:-.4px;
  font-variant-numeric:tabular-nums;
}
.ghost{
  position:fixed;
  z-index:1000;
  pointer-events:none;
  touch-action:none;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#313832;
  font-size:clamp(27px, 7.4vw, 38px);
  font-weight:860;
  box-shadow:0 10px 22px rgba(28,34,29,.18), 0 4px 0 rgba(0,0,0,.12);
  transform:translate(-50%,-50%) scale(1.07);
  will-change:left,top;
}
.ghost[data-color="green"]{background:var(--green)}
.ghost[data-color="yellow"]{background:var(--yellow)}
.ghost[data-color="gray"]{background:var(--tile)}
@media (max-width:370px){
  :root{--size:calc((100vw - 54px)/4);--gap:5px}
  .swapline{font-size:19px}
  .new-game{top:8px;right:8px;width:36px;height:36px}
}
</style>
</head>
<body>
<main class="main">
  <div class="wrap">
    <div class="board-shell">
      <div class="board" id="board" aria-label="Four by four number puzzle"></div>
      <button class="new-game" id="newGame" aria-label="New game">↻</button>
    </div>
    <div class="swapline" id="swapline">Swaps 0</div>
  </div>
</main>
<script>
(()=>{
'use strict';

const permutation=[1,3,0,2];
const base=[[0,5,6,5],[9,0,7,12],[4,13,0,4],[3,10,8,0]];
const targets=[16,28,21,21];
const solution=Array(16).fill(null);
for(let r=0;r<4;r++){
  for(let c=0;c<4;c++){
    solution[r*4+permutation[c]]=(r===c)?null:base[r][c];
  }
}

const movable=Array.from({length:16},(_,i)=>i).filter(i=>solution[i]!==null);
const shuffleSets=[
  [7,2,11,4,9,0,5,10,1,8,3,6],
  [4,9,0,7,10,2,11,1,8,5,6,3],
  [1,6,9,0,11,3,8,4,5,10,7,2],
  [10,5,2,8,3,11,6,0,9,4,1,7],
  [6,0,8,3,1,10,4,11,7,2,9,5]
];

let cells=[];
let swaps=0;
let drag=null;
let gameIndex=0;

const board=document.getElementById('board');
const swapline=document.getElementById('swapline');
const newGameButton=document.getElementById('newGame');

const isClue=i=>solution[i]===null;
const expectedRowForValue=v=>movable.filter(i=>solution[i]===v).map(i=>Math.floor(i/4));
const expectedColForValue=v=>movable.filter(i=>solution[i]===v).map(i=>i%4);

function color(i){
  if(isClue(i)) return 'clue';
  const v=cells[i];
  if(solution[i]===v) return 'green';
  const row=Math.floor(i/4);
  const col=i%4;
  return (expectedRowForValue(v).includes(row) || expectedColForValue(v).includes(col)) ? 'yellow' : 'gray';
}

function buildGame(fromSet){
  const sourceValues=movable.map(i=>solution[i]);
  cells=solution.slice();
  movable.forEach((pos,k)=>cells[pos]=sourceValues[fromSet[k]]);
  swaps=0;
  render();
}

function nextGame(){
  gameIndex=(gameIndex+1)%shuffleSets.length;
  buildGame(shuffleSets[gameIndex]);
}

function render(){
  board.innerHTML='';
  for(let i=0;i<16;i++){
    const el=document.createElement('div');
    el.className='tile'+(isClue(i)?' clue':'');
    el.dataset.index=i;
    el.dataset.color=color(i);
    el.textContent=isClue(i) ? targets[Math.floor(i/4)] : cells[i];
    if(!isClue(i)){
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('aria-label',`Number ${cells[i]}`);
      el.addEventListener('pointerdown', startDrag);
      el.addEventListener('keydown', keyboardSelection);
    }
    board.appendChild(el);
  }
  swapline.textContent=`Swaps ${swaps}`;
}

let picked=null;
function keyboardSelection(e){
  if(e.key!=='Enter'&&e.key!==' ') return;
  e.preventDefault();
  const i=Number(e.currentTarget.dataset.index);
  if(picked===null){
    picked=i;
    e.currentTarget.style.outline='3px solid #2d342f';
  }else{
    const from=picked;
    picked=null;
    swap(from,i);
  }
}

function startDrag(e){
  if(e.button!==undefined && e.button!==0) return;
  e.preventDefault();
  const from=Number(e.currentTarget.dataset.index);
  const rect=e.currentTarget.getBoundingClientRect();
  const ghost=document.createElement('div');
  ghost.className='ghost';
  ghost.dataset.color=color(from);
  ghost.textContent=cells[from];
  ghost.style.width=rect.width+'px';
  ghost.style.height=rect.height+'px';
  ghost.style.left=e.clientX+'px';
  ghost.style.top=e.clientY+'px';
  document.body.appendChild(ghost);
  drag={from,id:e.pointerId,ghost,source:e.currentTarget,target:null};
  drag.source.classList.add('drag-source');
  window.addEventListener('pointermove', moveDrag, {passive:false});
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', cancelDrag);
}

function moveDrag(e){
  if(!drag || e.pointerId!==drag.id) return;
  e.preventDefault();
  drag.ghost.style.left=e.clientX+'px';
  drag.ghost.style.top=e.clientY+'px';
  if(drag.target) drag.target.classList.remove('drop-target');
  const hovered=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile');
  drag.target=hovered && !hovered.classList.contains('clue') && Number(hovered.dataset.index)!==drag.from ? hovered : null;
  if(drag.target) drag.target.classList.add('drop-target');
}

function clearDrag(){
  if(!drag) return;
  drag.ghost.remove();
  drag.source.classList.remove('drag-source');
  if(drag.target) drag.target.classList.remove('drop-target');
  drag=null;
  window.removeEventListener('pointermove', moveDrag);
  window.removeEventListener('pointerup', endDrag);
  window.removeEventListener('pointercancel', cancelDrag);
}

function endDrag(e){
  if(!drag || e.pointerId!==drag.id) return;
  const from=drag.from;
  const to=drag.target ? Number(drag.target.dataset.index) : null;
  clearDrag();
  if(to!==null) swap(from,to);
}

function cancelDrag(){ clearDrag(); }

function swap(a,b){
  if(a===b || isClue(a) || isClue(b)) return;
  [cells[a],cells[b]]=[cells[b],cells[a]];
  swaps++;
  render();
}

newGameButton.addEventListener('click', nextGame);

buildGame(shuffleSets[gameIndex]);
})();
</script>
</body>
</html>

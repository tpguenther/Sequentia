<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F8F6"><title>Neighbors</title><style>
:root{--ink:#29333b;--blue:#86abc8;--yellow:#e8c75e;--line:#d7dcdb;--bg:#f7f8f6;--tile:#fff;--size:min(calc((100vw - 76px)/6),69px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}main{min-height:100dvh;max-width:550px;margin:auto;display:flex;flex-direction:column;align-items:center;padding:30px 17px 35px}.top{width:min(100%,444px);display:flex;justify-content:space-between;align-items:center;min-height:38px}.brand{font-size:25px;letter-spacing:-1.15px;font-weight:750}.reset{appearance:none;display:grid;place-items:center;border:0;background:#e9edeb;color:#44535c;border-radius:50%;width:38px;height:38px;cursor:pointer}.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;padding:18px 0 42px}.board{display:grid;grid-template-columns:repeat(6,var(--size));grid-template-rows:repeat(6,var(--size));gap:4px;padding:7px;border:2px solid var(--ink);border-radius:14px;background:var(--line);box-shadow:0 5px 0 rgba(41,51,59,.12);touch-action:manipulation;user-select:none;-webkit-user-select:none}.cell{border:0;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--tile);padding:0;position:relative;cursor:pointer;touch-action:manipulation}.cell.clue{background:#f0f2f0;cursor:default}.piece{display:flex;align-items:center;justify-content:center;width:64%;height:64%;transition:transform .13s ease,opacity .13s ease}.piece.blue{background:var(--blue);border-radius:50%;box-shadow:inset 0 -2px 0 rgba(38,66,85,.08)}.piece.yellow{background:var(--yellow);border-radius:18%;box-shadow:inset 0 -2px 0 rgba(99,76,14,.08)}.clue-ring{height:67%;width:67%;border:4px solid;border-radius:50%;display:grid;place-items:center;font-weight:750;font-size:clamp(17px,5vw,25px);line-height:1;background:#fff}.clue-ring.blue{color:#547d9b;border-color:var(--blue)}.clue-ring.yellow{color:#a68d32;border-color:var(--yellow)}.cell.bad .clue-ring{outline:2px solid #d06a67;outline-offset:3px}.cell:focus-visible{outline:3px solid #516a80;outline-offset:-4px}.status{height:38px;display:flex;align-items:center;justify-content:center;margin-top:24px;color:#6c7779;font-size:13px;letter-spacing:.02em}.status.win{color:#3c6d58;font-weight:700;font-size:18px}.key{display:flex;align-items:center;justify-content:center;gap:22px;color:#69767b;font-size:12px}.key span{display:flex;align-items:center;gap:9px}.mini{width:16px;height:16px;display:inline-block}.mini.circle{border-radius:50%;background:var(--blue)}.mini.square{border-radius:3px;background:var(--yellow)}@media(max-height:630px){main{padding-top:16px}.wrap{padding:14px 0}.status{margin-top:13px}}@media(prefers-reduced-motion:reduce){.piece{transition:none}}
</style></head><body><main><div class="top"><div class="brand">neighbors</div><button class="reset" id="reset" aria-label="Restart puzzle" title="Restart puzzle"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a9 9 0 1 1 2.6 6.4"/><path d="M3 4v7h7"/></svg></button></div><div class="wrap"><div class="board" id="board" role="group" aria-label="Six by six logic puzzle"></div><div class="status" id="status" aria-live="polite"></div><div class="key"><span><i class="mini circle"></i>Tap</span><span><i class="mini square"></i>Double tap</span></div></div></main><script>
(()=>{'use strict';
// 1 = dusty-blue circle; 0 = yellow square. The numbered clues are fixed pieces and count in each row and column.
const solution=['001011','111000','100110','011001','000111','110100'].join('').split('').map(Number);
// Signature count = orthogonal adjacent tiles of the clue's own color.
const clues=[11,35,15,23,32,25,5];
const neighbors=i=>[i-6,i+6,i-1,i+1].filter(j=>j>=0&&j<36&&Math.abs((j/6|0)-(i/6|0))+Math.abs(j%6-i%6)===1);
const clueCounts=Object.fromEntries(clues.map(i=>[i,neighbors(i).filter(j=>solution[j]===solution[i]).length]));
const board=document.getElementById('board'),status=document.getElementById('status');
let cells=Array(36).fill(null),pending=null,lastTap=-1,lastAt=0,complete=false;
for(const i of clues)cells[i]=solution[i];
function isGood(){if(cells.some(v=>v===null))return false;for(let r=0;r<6;r++){if(Array.from({length:6},(_,c)=>cells[r*6+c]).filter(v=>v===1).length!==3)return false; if(Array.from({length:6},(_,c)=>cells[c*6+r]).filter(v=>v===1).length!==3)return false;}return clues.every(i=>neighbors(i).filter(j=>cells[j]===cells[i]).length===clueCounts[i]);}
function paint(){board.replaceChildren();for(let i=0;i<36;i++){const b=document.createElement('button');b.className='cell'+(clues.includes(i)?' clue':'');b.type='button';const value=cells[i];if(clues.includes(i)){const ring=document.createElement('span');ring.className='clue-ring '+(value===1?'blue':'yellow');ring.textContent=clueCounts[i];b.append(ring);b.setAttribute('aria-label',`${value===1?'Blue':'Yellow'} fixed clue ${clueCounts[i]}`);const relevant=neighbors(i),nown=relevant.filter(j=>cells[j]===value).length,missing=relevant.filter(j=>cells[j]===null).length;if(nown>clueCounts[i]||nown+missing<clueCounts[i])b.classList.add('bad');}else{if(value!==null){const p=document.createElement('span');p.className='piece '+(value===1?'blue':'yellow');b.append(p)}b.setAttribute('aria-label',`Row ${1+(i/6|0)}, column ${1+i%6}: ${value===null?'blank':value===1?'blue circle':'yellow square'}`);b.addEventListener('pointerup',e=>{if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();tap(i)});b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();set(i,cells[i]===null?1:null)}else if(e.key==='s'||e.key==='S'){e.preventDefault();set(i,0)}});}board.append(b)}complete=isGood();status.textContent=complete?'Well played!':'';status.classList.toggle('win',complete)}
function set(i,v){if(complete)return;cells[i]=v;paint()}
function tap(i){if(complete)return;const now=performance.now();if(pending&&lastTap===i&&now-lastAt<340){clearTimeout(pending);pending=null;lastTap=-1;set(i,0);return;}if(pending){clearTimeout(pending);set(lastTap,cells[lastTap]===null?1:null);pending=null}lastTap=i;lastAt=now;pending=setTimeout(()=>{pending=null;lastTap=-1;set(i,cells[i]===null?1:null)},290)}
document.getElementById('reset').addEventListener('click',()=>{if(pending)clearTimeout(pending);pending=null;lastTap=-1;cells=Array(36).fill(null);for(let i of clues)cells[i]=solution[i];complete=false;paint()});paint();
})();
</script></body></html>
